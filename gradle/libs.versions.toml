# Pin rule: newest stable (no alpha/beta/rc/M/dev) uploaded at least 14 days before pinning.
# Each comment gives the upload date and its source (checked 2026-10-12): G = dl.google.com/android/maven2,
# C = repo1.maven.org/maven2, P = plugins.gradle.org/m2 (Last-Modified of the POM).

[versions]
# 2026-09-18, G com/android/tools/build/gradle/9.4.1
agp = "9.4.1"
# 2026-09-07, C org/jetbrains/kotlin/kotlin-gradle-plugin/2.4.20 (2.4.21 is from 2026-10-08, too new)
kotlin = "2.4.20"
# 2026-09-29, P org.jetbrains.kotlinx.kover/0.9.11: rule exception D55 (0.9.10 reports 0% with the configuration cache, kover #831)
kover = "0.9.11"
# 2026-08-04, P dev.detekt/2.0.0-alpha.6: pre-stable by decision D47
detekt = "2.0.0-alpha.6"
# 2026-03-12, P org.jlleitschuh.gradle.ktlint/14.2.0 (AGP 9 built-in Kotlin since 14.1.0, #1016)
ktlintGradle = "14.2.0"
# 2025-11-14, C com/pinterest/ktlint/ktlint-cli/1.8.0
ktlint = "1.8.0"
# 2026-09-24, C io/nlopez/compose/rules/ktlint/0.6.7
composeRules = "0.6.7"
# 2026-09-09, G androidx/compose/compose-bom/2026.09.00 (ui 1.12.1, material3 1.4.0)
composeBom = "2026.09.00"
# 2026-03-11, G androidx/activity/activity-compose/1.13.0
activityCompose = "1.13.0"
# 2026-06-17, G androidx/lifecycle/lifecycle-runtime-ktx and lifecycle-service 2.11.0
lifecycle = "2.11.0"
# 2026-05-07, C org/jetbrains/kotlinx/kotlinx-coroutines-core/1.11.0
coroutines = "1.11.0"
# 2026-08-07, C org/junit/junit-bom/6.1.3
junit = "6.1.3"
# 2021-02-13, C junit/junit/4.13.2
junit4 = "4.13.2"
# 2026-09-10, C org/robolectric/robolectric/4.17 (SDK 36 and 37)
robolectric = "4.17"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
compose-rules-ktlint = { group = "io.nlopez.compose.rules", name = "ktlint", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# the Compose compiler ships with Kotlin and must match its version
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint-gradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
